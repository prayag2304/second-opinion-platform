# Spring Boot backend configuration
# Database config for local development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${FILE_UPLOAD_MAX_SIZE:10485760}
spring.servlet.multipart.max-request-size=${FILE_UPLOAD_MAX_SIZE:10485760}

# Mail settings (optional)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application server and JWT
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:verysecretkeychangemeinproduction}
jwt.expiration=${JWT_EXPIRATION:3600}

# Application file settings
app.file.max-size=${FILE_UPLOAD_MAX_SIZE:10485760}
app.file.allowed-types=application/pdf,image/jpeg,image/png,image/jpg

# Logging levels
logging.level.com.prayaghudar=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# OpenAPI / Swagger UI paths
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html